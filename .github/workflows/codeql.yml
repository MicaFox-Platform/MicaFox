name: CodeQL

# Advanced setup instead of GitHub's default setup: default setup scans pull requests into `main` only, so an alert
# introduced on `staging` surfaced first in the release pull request
on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels the scan of its previous commit; the scans of staging, main and the schedule
# each get a group of their own, so they always finish and keep the baseline pull requests are compared with
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
